name: create tag and release on merge pr

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  create-release:
    if: github.event.pull_request.merged == true
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: set config tag and release
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::warning::$TAG already exists: nothing to release (VERSION was not bumped)"
            echo "SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi
          {
            echo "VERSION=$VERSION"
            echo "TAG_NAME=$TAG"
            echo "RELEASE_NAME=LAN File Share $TAG"
            [[ "$VERSION" == *-* ]] && echo "PRERELEASE=true" || echo "PRERELEASE=false"
          } >> "$GITHUB_ENV"
          # PR text goes through env + a file, never straight into the script
          printf '%s\n\n%s\n' "${PR_TITLE#Release $TAG - }" "${PR_BODY//\[...autoGenerate\]/}" > release-notes.md

      - uses: ./.github/actions/setup-environment
        if: env.SKIP != 'true'
        with:
          android: 'true'

      - name: build the source tarball
        if: env.SKIP != 'true'
        run: |
          NAME="devkit-lan-file-share-$VERSION"
          mkdir -p dist
          git archive --format=tar.gz --prefix="$NAME/" -o "dist/$NAME.tar.gz" HEAD

      # Without the signing secrets the release has the source only: an APK signed with a throwaway key
      # could not update the previous one.
      - name: build the signed APK
        if: env.SKIP != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::warning::no ANDROID_KEYSTORE_BASE64 secret: releasing without an APK"
            exit 0
          fi
          export ANDROID_KEYSTORE="$RUNNER_TEMP/release.keystore"
          base64 -d <<< "$KEYSTORE_BASE64" > "$ANDROID_KEYSTORE"
          android/build.sh
          cp android/build/lan-file-share.apk "dist/lan-file-share-$VERSION.apk"

      - name: write the checksums
        if: env.SKIP != 'true'
        run: |
          (cd dist && sha256sum ./* > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: create tag and release
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG_NAME" dist/* \
            --target "${{ github.event.pull_request.merge_commit_sha }}" \
            --title "$RELEASE_NAME" \
            --notes-file release-notes.md \
            --generate-notes \
            --prerelease="$PRERELEASE" \
            --latest="$([[ $PRERELEASE == true ]] && echo false || echo true)"
