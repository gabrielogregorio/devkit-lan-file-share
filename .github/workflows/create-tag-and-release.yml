name: create tag and release on merge pr

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  create-release:
    # A release comes only from a PR of a release/X.Y.Z branch of this repository. Any other merge publishes nothing.
    if: >-
      github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'release/')
      && github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: set config tag and release
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION=$(.github/scripts/release-version.sh "$RELEASE_BRANCH")
          TAG="v$VERSION"
          {
            echo "VERSION=$VERSION"
            echo "TAG_NAME=$TAG"
            echo "RELEASE_NAME=LAN File Share $TAG"
            [[ "$VERSION" == *-* ]] && echo "PRERELEASE=true" || echo "PRERELEASE=false"
          } >> "$GITHUB_ENV"
          # PR text goes through env + a file, never straight into the script
          printf '%s\n\n%s\n' "${PR_TITLE#Release $TAG - }" "${PR_BODY//\[...autoGenerate\]/}" > release-notes.md

      - uses: ./.github/actions/setup-environment
        with:
          android: 'true'

      - name: build the source tarball
        run: |
          NAME="devkit-lan-file-share-$VERSION"
          mkdir -p dist
          git archive --format=tar.gz --prefix="$NAME/" -o "dist/$NAME.tar.gz" HEAD

      # Without the signing secrets the release has the source only: an APK signed with a throwaway key
      # could not update the previous one.
      - name: build the signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::warning::no ANDROID_KEYSTORE_BASE64 secret: releasing without an APK"
            exit 0
          fi
          export ANDROID_KEYSTORE="$RUNNER_TEMP/release.keystore"
          base64 -d <<< "$KEYSTORE_BASE64" > "$ANDROID_KEYSTORE"
          android/build.sh
          cp android/build/lan-file-share.apk "dist/lan-file-share-$VERSION.apk"

      - name: write the checksums
        run: |
          (cd dist && sha256sum ./* > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG_NAME" dist/* \
            --target "${{ github.event.pull_request.merge_commit_sha }}" \
            --title "$RELEASE_NAME" \
            --notes-file release-notes.md \
            --generate-notes \
            --prerelease="$PRERELEASE" \
            --latest="$([[ $PRERELEASE == true ]] && echo false || echo true)"
