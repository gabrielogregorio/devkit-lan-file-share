name: check lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + mypy + shellcheck)
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-environment

      - name: Ruff (version from uv.lock)
        run: .venv/bin/ruff check --output-format=github .

      - name: Types (mypy, strict)
        run: .venv/bin/mypy server tray tray_icon.py tests conftest.py

      - name: ShellCheck
        run: shellcheck --severity=warning ./*.sh android/*.sh e2e/*.sh .github/scripts/*.sh

      - name: Scripts are executable in git
        run: |
          bad=$(git ls-files -s '*.sh' 'tray_icon.py' 'e2e/*.py' | awk '$1 != "100755" {print $4}')
          if [[ -n "$bad" ]]; then
            for f in $bad; do echo "::error file=$f::not executable in git: git update-index --chmod=+x $f"; done
            exit 1
          fi

      - name: Actions are pinned to a commit hash
        run: |
          bad=$(grep -rnE '^\s*(- )?uses:\s' .github | grep -vE 'uses:\s+\./' | grep -vE '@[0-9a-f]{40}( |$)' || true)
          if [[ -n "$bad" ]]; then
            echo "$bad" | while IFS=: read -r f l _; do echo "::error file=$f,line=$l::pin this action to a full commit hash (# vX.Y.Z as comment)"; done
            exit 1
          fi

      - name: Workflow files are valid YAML
        run: python3 -c "import sys, yaml; [yaml.safe_load(open(f)) for f in sys.argv[1:]]" .github/workflows/*.yml .github/ISSUE_TEMPLATE/*.yml .github/actions/*/action.yml .github/dependabot.yml

      - name: The exported requirements match uv.lock
        run: |
          .venv/bin/python - <<'PY'
          import re, tomllib
          from pathlib import Path
          locked = {package["name"]: package["version"] for package in tomllib.loads(Path("uv.lock").read_text())["package"]}
          exported = dict(re.findall(r"^([a-z0-9-]+)==([^ ;\\]+)", Path("requirements-dev.txt").read_text(), re.M))
          different = {name: version for name, version in exported.items() if locked.get(name) != version}
          raise SystemExit(f"requirements-dev.txt differs from uv.lock: {different}" if different else 0)
          PY
