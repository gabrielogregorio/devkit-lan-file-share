name: Feature request
description: Something new on the phone, on the panel or in how files arrive
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what gets in the way today
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: The solution you would like
      description: e.g. "PC to phone transfers", "a folder per device"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
