name: 'Setup Environment'
description: 'Creates the Python venv from the locked requirements, the system packages and, optionally, the Android tools'
inputs:
  android:
    description: 'Also install Java and the Android SDK packages'
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: System packages
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq shellcheck xvfb dbus python3-gi gir1.2-ayatanaappindicator3-0.1 python3-segno

    - name: Python venv (system python3, locked versions, hashes checked)
      shell: bash
      run: ./setup-dev.sh

    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      if: ${{ inputs.android == 'true' }}
      with:
        distribution: temurin
        java-version: '21'

    - name: Android SDK packages
      if: ${{ inputs.android == 'true' }}
      shell: bash
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" "platforms;android-36" > /dev/null
        echo "JDK_BIN=$JAVA_HOME/bin" >> "$GITHUB_ENV"
