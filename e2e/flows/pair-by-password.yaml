# What it tests: a clean app finds the PC on the network by itself, the default password is refused,
# and with the right one Find PC pairs.
# Why it matters: it is the way in without a camera, and a wrong password must say so and not pair.
appId: com.devkit.lanfileshare
---
# the app searches only once when it opens, so a datagram lost on a freshly booted emulator leaves it on
# "PC not found" for good; reopening keeps testing that a clean app finds the PC without a tap
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      - extendedWaitUntil:
          visible:
            id: ".*:id/status"
            text: "Wrong password"
          timeout: 15000
- tapOn:
    id: ".*:id/password"
- waitForAnimationToEnd
- eraseText: 8
- inputText: ${PASSWORD}
- hideKeyboard
# a datagram can get lost while a freshly booted emulator is under load, and a person would just tap again
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: ".*:id/find"
      - extendedWaitUntil:
          visible:
            id: ".*:id/status"
            text: "Connected to e2e-pc"
          timeout: 20000
